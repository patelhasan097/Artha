<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artha — Offline</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0B0A09; color:#A39C90; font-family:'Inter',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:24px; }
  img { width:52px; height:52px; margin-bottom:22px; border-radius:14px; }
  h1 { color:#F4F0E8; font-size:21px; margin-bottom:8px; font-family:'Fraunces',serif; font-weight:600; }
  p { font-size:13.5px; line-height:1.6; max-width:280px; }
  button { margin-top:30px; padding:13px 26px; background:#E3A63E; color:#1C1305; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; }
</style>
</head>
<body>
  <img src="assets/logo.svg" alt="Artha">
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Your portfolio data is safe.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
