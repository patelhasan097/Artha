<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artha — Offline</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#05070d; color:#96a0b8; font-family:'Inter',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:24px; }
  img { width:56px; height:56px; margin-bottom:22px; border-radius:16px; }
  h1 { color:#eef2f9; font-size:21px; margin-bottom:8px; font-family:'Outfit',sans-serif; }
  p { font-size:13.5px; line-height:1.6; max-width:280px; }
  button { margin-top:30px; padding:13px 26px; background:linear-gradient(120deg,#00e0b8,#00b4d8,#8b5cf6); color:#06110d; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Outfit',sans-serif; }
</style>
</head>
<body>
  <img src="assets/logo.svg" alt="Artha">
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Your portfolio data is safe.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
