name: Deploy Artha to GitHub Pages

# Runs on every push to main. Builds js/config.js from GitHub Secrets right
# before deploying — the real Firebase keys and Worker URL never touch the
# repository itself, not even in git history.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate js/config.js from repo secrets
        run: |
          cat > js/config.js << EOF
          // Auto-generated at deploy time by .github/workflows/deploy.yml
          // — do not edit this file directly, it is overwritten on every deploy.
          // Real values live in Settings → Secrets and variables → Actions,
          // never in this repository.
          const FIREBASE_CONFIG = {
            apiKey:            "${{ secrets.FIREBASE_API_KEY }}",
            authDomain:        "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId:         "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket:     "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId:             "${{ secrets.FIREBASE_APP_ID }}"
          };

          const PROXY_BASE_URL = "${{ secrets.PROXY_BASE_URL }}";

          firebase.initializeApp(FIREBASE_CONFIG);
          const db   = firebase.firestore();
          const auth = firebase.auth();

          const APP_NAME    = 'Artha';
          const APP_VERSION = '2.1.0';
          const PIN_SALT    = 'artha_secure_salt_v2';
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
