<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Warm near-black background, rounded square -->
  <rect width="100" height="100" rx="24" fill="#0B0A09"/>
  <rect width="100" height="100" rx="24" fill="none" stroke="rgba(255,250,240,0.06)" stroke-width="1"/>

  <!-- 'A' as a single confident gold mark — two ascending strokes to a summit,
       crossbar reads as a rising line. No gradient: one flat, considered color. -->
  <path d="M50 22 L76 74 L64 74 L59 63 L41 63 L36 74 L24 74 Z"
        fill="none" stroke="#E3A63E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M44.5 60 L50 48 L55.5 60" fill="none" stroke="#E3A63E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Summit point -->
  <circle cx="50" cy="22" r="4" fill="#E3A63E"/>
</svg>
