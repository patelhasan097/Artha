<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="24" y1="76" x2="76" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00e0b8"/>
      <stop offset="50%"  stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="goldDot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a825"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect width="100" height="100" rx="24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- 'A' formed by an ascending candle/mountain motif -->
  <path d="M50 20 L74 72 L62 72 L57.5 61 L42.5 61 L38 72 L26 72 Z"
        fill="none" stroke="url(#markGrad)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Crossbar as ascending trend line -->
  <path d="M44 58 L50 45 L56 58" fill="none" stroke="url(#markGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak dot (summit / wealth apex) -->
  <circle cx="50" cy="20" r="5" fill="url(#goldDot)"/>
</svg>
