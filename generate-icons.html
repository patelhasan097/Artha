<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Artha — Icon Generator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0B0A09; color: #F4F0E8; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 40px 20px; }
  h1 { font-size: 22px; }
  p { color: #A39C90; font-size: 14px; text-align: center; max-width: 380px; line-height: 1.6; }
  button { padding: 14px 26px; background: #E3A63E; color: #1C1305; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:hover { opacity: 0.9; }
  #log { font-size: 12px; color: #3ED68C; text-align: center; white-space: pre-line; max-width: 320px; }
  .previews { display: flex; gap: 14px; align-items: center; }
  canvas { border-radius: 20px; background: #16130F; }
  .lbl { font-size: 11px; color: #675F53; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Artha Icon Generator</h1>
  <p>Ek click mein saari PWA icon sizes generate + download ho jayengi — regular + maskable safe-zone dono. Files ko <code>assets/icons/</code> folder mein daal dena.</p>

  <div class="previews">
    <div><canvas id="prevRegular" width="180" height="180"></canvas><div class="lbl">Regular</div></div>
    <div><canvas id="prevMaskable" width="180" height="180"></canvas><div class="lbl">Maskable (safe-zone)</div></div>
  </div>

  <button onclick="generateAll()">⬇ Generate &amp; Download All</button>
  <div id="log"></div>

<script>
const SVG_STR = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <path d="M50 22 L76 74 L64 74 L59 63 L41 63 L36 74 L24 74 Z" fill="none" stroke="#E3A63E" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M44.5 60 L50 48 L55.5 60" fill="none" stroke="#E3A63E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="22" r="4" fill="#E3A63E"/>
</svg>`;

const REGULAR_SIZES  = [72, 96, 128, 144, 152, 192, 384, 512];
const MASKABLE_SIZES = [192, 512];

function roundedRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBg(ctx, size, rounded) {
  ctx.fillStyle = '#0B0A09';
  if (rounded) { roundedRectPath(ctx, 0, 0, size, size, size * 0.22); ctx.fill(); }
  else { ctx.fillRect(0, 0, size, size); }
}

function loadSvgImage() {
  return new Promise((resolve) => {
    const blob = new Blob([SVG_STR], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { resolve(img); URL.revokeObjectURL(url); };
    img.src = url;
  });
}

async function drawRegular(canvas, size) {
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  drawBg(ctx, size, true);
  const img = await loadSvgImage();
  const pad = size * 0.16;
  ctx.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
  return canvas.toDataURL('image/png');
}

async function drawMaskable(canvas, size) {
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  drawBg(ctx, size, false);
  const img = await loadSvgImage();
  const pad = size * 0.26; // generous safe zone — OS masks crop the outer ring
  ctx.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
  return canvas.toDataURL('image/png');
}

async function download(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  await new Promise((r) => setTimeout(r, 250));
}

async function generateAll() {
  const log = document.getElementById('log');
  log.textContent = 'Generating…';
  let count = 0;
  const total = REGULAR_SIZES.length + MASKABLE_SIZES.length;

  for (const size of REGULAR_SIZES) {
    const c = document.createElement('canvas');
    const data = await drawRegular(c, size);
    await download(data, `icon-${size}.png`);
    count++;
    log.textContent = `${count}/${total} done — icon-${size}.png ✓`;
  }
  for (const size of MASKABLE_SIZES) {
    const c = document.createElement('canvas');
    const data = await drawMaskable(c, size);
    await download(data, `icon-maskable-${size}.png`);
    count++;
    log.textContent = `${count}/${total} done — icon-maskable-${size}.png ✓`;
  }
  log.textContent = `✅ All ${total} icons downloaded!\nMove them into assets/icons/ folder.`;
}

window.onload = async () => {
  await drawRegular(document.getElementById('prevRegular'), 180);
  await drawMaskable(document.getElementById('prevMaskable'), 180);
};
</script>
</body>
</html>
